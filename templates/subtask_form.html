{% extends "base.html" %}

{% block title %}
SubTask
{% endblock %}

{% block content %}

<div class="container-fluid">

    <h4 class="page-title">
        {% if object %}
        Edit SubTask
        {% else %}
        Add SubTask
        {% endif %}
    </h4>


    <div class="row">

        <div class="col-md-8">

            <div class="card">

                <div class="card-header">

                    <div class="card-title">
                        SubTask Information
                    </div>

                </div>


                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            <i class="la la-save"></i>

                            Save SubTask

                        </button>


                        <a
                            href="javascript:history.back()"
                            class="btn btn-secondary"
                        >

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
