{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hangarin - Sign Out</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        body {
            background-color: #f8f9fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logout-card h2 {
            margin-bottom: 15px;
        }

        .logout-card p {
            color: #6c757d;
            margin-bottom: 25px;
        }

        .btn {
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="logout-card">

        <h2>Sign Out</h2>

        <p>
            Are you sure you want to sign out of your Hangarin account?
        </p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Sign Out
            </button>

            <a href="{% url 'task-list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>

</body>
</html>
