{% extends 'base.html' %}

{% load static %}

{% block content %}

<div class="content">

    <div class="container-fluid">

        <h4 class="page-title">Tasks</h4>

        <div class="row">

            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">

                        <div class="card-title">
                            Delete Task
                        </div>

                        <div class="card-category">
                            Confirm deletion
                        </div>

                    </div>

                    <div class="card-body">

                        <p>
                            Are you sure you want to delete this task?
                        </p>

                        <p>
                            <strong>{{ object.title }}</strong>
                        </p>


                        <form method="post">

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-danger btn-rounded"
                            >
                                Delete
                            </button>

                            <a
                                href="{% url 'task-list' %}"
                                class="btn btn-secondary btn-rounded"
                            >
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
