{% extends "base.html" %}

{% block title %}
Delete SubTask
{% endblock %}

{% block content %}

<div class="container-fluid">

    <h4 class="page-title">
        Delete SubTask
    </h4>


    <div class="row">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body">

                    <h5>
                        Are you sure you want to delete this SubTask?
                    </h5>

                    <p>
                        <strong>{{ object.title }}</strong>
                    </p>


                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >

                            <i class="la la-trash"></i>

                            Yes, Delete

                        </button>


                        <a
                            href="javascript:history.back()"
                            class="btn btn-secondary"
                        >

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
