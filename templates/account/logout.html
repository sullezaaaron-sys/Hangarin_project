{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hangarin - Logout</title>


    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="{% static 'css/bootstrap.min.css' %}"
    >


    <!-- Ready Dashboard -->

    <link
        rel="stylesheet"
        href="{% static 'css/ready.css' %}"
    >


    <style>

        body {
            background-color: #f8f9fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-card {
            width: 100%;
            max-width: 450px;
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logout-card h2 {
            margin-bottom: 15px;
        }

        .logout-card p {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .logout-card .btn {
            margin: 5px;
        }

    </style>

</head>


<body>


    <div class="logout-card">


        <h2>
            Sign Out
        </h2>


        <p>
            Are you sure you want to sign out of your Hangarin account?
        </p>


        <form
            method="post"
            action="{% url 'account_logout' %}"
        >

            {% csrf_token %}


            <button
                type="submit"
                class="btn btn-danger"
            >
                Yes, Sign Out
            </button>


            <a
                href="{% url 'home' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>


    </div>


</body>

</html>
